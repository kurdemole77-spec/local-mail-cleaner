[project]
name = "local-mail-cleaner"
version = "0.1.0"
description = "Local, read-only newsletter subscription scanner for IMAP mailboxes (stage A)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - personal use" }
dependencies = [
    "dkimpy==1.1.8",
    "dnspython==2.8.0",
    "keyring==25.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "cryptography>=42"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "gui: Tkinter smoke tests (skipped when no display or Tk is available)",
]
